# Copier vers config.local.toml (ignoré par Git). Ne jamais publier l'adresse du hub.
[train]
hub_address = ""
motor_port = 0             # A=0, B=1
light_port = 1             # Ici moteur A, éclairage B
motor_power = 40            # vitesse de pointe à calibrer
direction = -1             # sens validé sur le circuit monté
ramp_seconds = 3.0        # montée et freinage progressifs (secondes)
seconds_per_lap = 15.0     # À mesurer sur le circuit réel
max_trip_seconds = 240.0
keepalive_seconds = 60     # demande l'état batterie, connexion BLE maintenue au repos

[schedule]
start_hour = 7
end_hour = 22              # dernier départ à 22:00; dernier :30 à 21:30
evening_start = 17
idle_evening_brightness = 30

[audio]
music_enabled = true
music_volume = 0.35        # entre 0 et 1
